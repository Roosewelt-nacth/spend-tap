<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Spend Tracker</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="titlebar" id="titlebar">
    <span class="titlebar-title">💸 Spend Tracker</span>
    <div class="titlebar-actions">
      <button id="pinBtn" title="Toggle always-on-top">📌</button>
      <button id="settingsBtn" title="Settings">⚙️</button>
      <button id="minBtn" title="Minimize">—</button>
      <button id="closeBtn" title="Close">✕</button>
    </div>
  </div>

  <!-- ONBOARDING / SETTINGS VIEW -->
  <div id="setupView" class="view hidden">
    <div class="scroll">
      <h2>Setup</h2>

      <label class="section-label">Supabase</label>
      <input id="supabaseUrl" placeholder="Project URL (https://xxxx.supabase.co)" />
      <input id="supabaseKey" placeholder="anon public key" />

      <label class="section-label">Anthropic (for AI advice)</label>
      <input id="anthropicKey" placeholder="sk-ant-... (optional)" />

      <label class="section-label">Categories (3-5)</label>
      <div id="categoryList"></div>
      <div class="row">
        <input id="newCategory" placeholder="Add category" />
        <button id="addCategoryBtn">+</button>
      </div>

      <label class="section-label">Budgets (₹)</label>
      <div class="row">
        <input id="dailyBudget" type="number" placeholder="Daily" />
        <input id="weeklyBudget" type="number" placeholder="Weekly" />
      </div>

      <div id="setupError" class="error hidden"></div>
      <button id="saveSetupBtn" class="primary">Save &amp; Continue</button>
      <button id="backToWidgetBtn" class="secondary hidden">Back</button>
    </div>
  </div>

  <!-- MAIN WIDGET VIEW -->
  <div id="widgetView" class="view hidden">
    <div class="scroll">
      <div class="budget-panel">
        <div class="budget-row">
          <span>Today</span>
          <span id="dailySpendLabel">₹0 / ₹0</span>
        </div>
        <div class="budget-bar"><div id="dailyBar" class="budget-bar-fill"></div></div>
        <div class="budget-row muted">
          <span>This week</span>
          <span id="weeklySpendLabel">₹0 / ₹0</span>
        </div>
        <div class="budget-bar"><div id="weeklyBar" class="budget-bar-fill"></div></div>
      </div>

      <form id="entryForm" class="entry-form">
        <input id="amount" type="number" step="0.01" placeholder="Amount ₹" required />
        <select id="category"></select>
        <input id="note" placeholder="Why this spend? (note)" />
        <div class="row">
          <label class="pill"><input type="radio" name="payMethod" value="upi" checked /> UPI</label>
          <label class="pill"><input type="radio" name="payMethod" value="cash" /> Cash</label>
          <label class="pill impulse-pill"><input type="checkbox" id="isImpulse" /> Impulse</label>
        </div>
        <button type="submit" class="primary">Add spend</button>
      </form>

      <div id="formError" class="error hidden"></div>

      <div class="advice-panel">
        <button id="adviceBtn" class="secondary">Get AI advice</button>
        <div id="adviceText" class="advice-text hidden"></div>
      </div>

      <label class="section-label">Recent</label>
      <div id="entryList" class="entry-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
