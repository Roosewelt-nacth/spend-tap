name: Android

# Tests on every push and pull request.
# Pushing a tag like v0.1.0 also builds a signed APK + AAB and publishes them as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.2 build-tools;36.1.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "No signing key configured: the APK will be unsigned."
          fi

      - name: Build release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0-dev' }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Collect files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/SpendTap.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/SpendTap.aab
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: SpendTap-android
          path: android-app/dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/SpendTap.apk dist/SpendTap.aab \
            --repo "${{ github.repository }}" \
            --title "Spend Tap ${{ github.ref_name }}" \
            --generate-notes
